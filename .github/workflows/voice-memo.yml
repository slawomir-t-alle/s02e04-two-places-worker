name: Voice memo worker
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture transcript or submit timed notes
        required: true
        type: choice
        options: [capture, submit]
      notes_json:
        description: JSON array of timed notes for submit mode
        required: false
        type: string
permissions:
  contents: read
jobs:
  voice-memo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run remote worker
        env:
          JOB_URL: ${{ secrets.JOB_URL }}
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
          MODE: ${{ inputs.mode }}
          NOTES_JSON: ${{ inputs.notes_json }}
        run: python3 worker.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-memo-result
          path: result.enc
          retention-days: 1
